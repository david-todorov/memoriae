services:

  database:
    image: postgres:17-alpine
    container_name: memoriae-database

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ./database/data:/var/lib/postgresql/data

    ports:
      - "${DB_PORT}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:v1.32.0
    container_name: memoriae-mail

    environment:
      MP_DATABASE: /data/mailpit.db

    volumes:
      - ./mail/data:/data

    ports:
      - "${MAIL_SMTP_PORT}:1025"
      - "${MAIL_UI_PORT}:8025"


  backend:
    container_name: memoriae-backend

    build:
      context: ./backend/memoriae-backend
      dockerfile: Dockerfile

    depends_on:
      database:
        condition: service_healthy

      mail:
        condition: service_started

    env_file:
      - ./.env-dev

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_MAIL_HOST: mail
      SPRING_MAIL_PORT: 1025

    ports:
      - "${BACKEND_PORT}:8080"