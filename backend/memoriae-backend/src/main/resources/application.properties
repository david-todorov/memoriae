spring.application.name=memoriae-backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memoriae}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:memoriae}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:memoriae_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Mail server
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}

# Memoriae sender identity
app.mail.from-address=${MAIL_FROM_ADDRESS:notifications@memoriae.local}
app.mail.from-name=${MAIL_FROM_NAME:Memoriae}